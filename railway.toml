# Railway configuration
# https://docs.railway.com/reference/config-as-code

[build]
# Fetch official LINE Chrome extension, patch for web, then install Node deps
buildCommand = "pip install requests && python3 scripts/fetch_and_patch.py && npm install"

[deploy]
startCommand = "npm start"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
